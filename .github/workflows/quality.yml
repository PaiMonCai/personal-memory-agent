name: Quality checks

on:
  push:
    branches: [main, "fix/**", "refactor/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm install --package-lock=false

      - name: JavaScript syntax (server)
        run: find server/src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: TypeScript check
        run: npm run check

      # PR 上验证两个 Dockerfile 都能构建；main 的推送由 docker-publish.yml
      # 构建并发布，顺带覆盖这一步，这里跳过以免重复构建
      - name: Build production images
        if: github.event_name == 'pull_request'
        run: |
          docker build -t personal-memory-agent-api:test .
          docker build -f Dockerfile.web -t personal-memory-agent-web:test .

      - name: DOM regression tests
        run: node tools/dom-test.mjs

      - name: Static contract checks
        run: python tools/static-check.py

      - name: WCAG contrast checks
        run: python tools/contrast-check.py

      - name: Validate self-hosted database baseline
        env:
          PGPASSWORD: postgres
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f database/001_baseline.sql

      - name: Smoke test self-hosted API
        env:
          NODE_ENV: test
          PORT: 3000
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
          OTP_PEPPER: ci-only-secret
          PREFERENCES_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
        run: |
          npm start > /tmp/pma-api.log 2>&1 &
          API_PID=$!
          trap 'kill $API_PID || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/api/health >/tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pma-api.log
          exit 1
